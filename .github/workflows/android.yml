name: App Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature privée (optionnelle)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
            echo "JARVIS_KEYSTORE=$RUNNER_TEMP/jarvis.jks" >> "$GITHUB_ENV"
          else
            echo "Signature avec la clé fixe du projet (android/app/jarvis-debug.keystore)."
          fi

      - name: Compiler l'APK
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Jarvis.apk

      - name: Vérifier l'APK
        run: |
          cd ..
          unzip -l Jarvis.apk | grep -E "assets/(melspectrogram|embedding_model|wakeword)\.onnx"
          unzip -l Jarvis.apk | grep -E "lib/arm64-v8a/libonnxruntime.so"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs Jarvis.apk | head -3
          ls -la Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android
          path: Jarvis.apk

      - name: Publier dans les Releases (android-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Jarvis Android (dernière version)" --notes "APK compilé automatiquement. Ouvre ce fichier sur ton téléphone pour installer ou mettre à jour Jarvis."
          gh release upload android-latest Jarvis.apk --clobber
