name: App Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (pour pouvoir mettre l'app à jour sans la désinstaller)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
            echo "JARVIS_KEYSTORE=$RUNNER_TEMP/jarvis.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de clé ANDROID_KEYSTORE_B64 : APK signé avec une clé de débogage temporaire."
          fi

      - name: Compiler l'APK
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android
          path: Jarvis.apk
